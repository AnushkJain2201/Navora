spring.application.name=backend

server.port=${SERVER_PORT:8080}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

spring.devtools.add-properties=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/navora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:navora_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:navora_pass}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:navora_minio}
minio.secret-key=${MINIO_SECRET_KEY:navora_minio_pass}
minio.bucket-name=${MINIO_BUCKET_NAME:scan-images}

management.endpoint.health.show-details=never