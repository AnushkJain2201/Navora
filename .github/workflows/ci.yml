name: CI

on:
  push:
    branches: [main, feat/phase9-ci-cd]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Smoke check, app imports cleanly
        run: python -c "import app.main"
        env:
          OPENAI_API_KEY: dummy-key-for-ci

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Start Postgres (PostGIS + pgvector) and MinIO
        working-directory: .
        run: |
          docker build -t navora-postgres infra/postgres
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_DB=navora -e POSTGRES_USER=navora_user -e POSTGRES_PASSWORD=navora_pass \
            navora-postgres
          until docker exec pg pg_isready -h localhost -U navora_user -d navora; do sleep 2; done
      - name: Apply migrations (context startup runs Flyway)
        run: mvn -B test -Dtest=BackendApplicationTests

      - name: Seed landmarks
        working-directory: .
        run: |
          docker exec -i pg psql -U navora_user -d navora \
            -v ON_ERROR_STOP=1 < infra/postgres/seed-landmarks.sql

      - name: Run all tests
        run: mvn -B test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  publish:
    needs: [frontend, ai-service, backend, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: ai-service
            context: ./ai-service
          - name: frontend
            context: ./frontend
          - name: postgres
            context: ./infra/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/navora-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/navora-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}