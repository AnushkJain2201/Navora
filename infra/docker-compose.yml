services:
  frontend:
    build: ../frontend
    ports: ["5173:5173"]

  backend:
    build: ../backend
    ports: ["8080:8080"]
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on: [ai-service, postgres]

  ai-service:
    build: ../ai-service
    ports: ["8000:8000"]

  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: navora
      POSTGRES_USER: navora_user
      POSTGRES_PASSWORD: navora_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: